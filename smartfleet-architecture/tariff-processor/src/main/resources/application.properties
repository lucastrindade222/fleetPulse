spring.application.name=tariff-processor

# ---- SmartFleet ----
server.port=8082
spring.threads.virtual.enabled=true

# Observabilidade
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.metrics.tags.application=tariff-processor
spring.datasource.url=jdbc:postgresql://localhost:5433/tariff
spring.datasource.username=smartfleet
spring.datasource.password=smartfleet
spring.jpa.hibernate.ddl-auto=update
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=tariff-processor
spring.kafka.consumer.auto-offset-reset=earliest
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
app.rabbit.queue=invoice-notifications
