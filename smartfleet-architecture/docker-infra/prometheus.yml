global:
  scrape_interval: 5s
scrape_configs:
  - job_name: smartfleet
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080   # api-gateway
          - host.docker.internal:8081   # ingestion-service
          - host.docker.internal:8082   # tariff-processor
          - host.docker.internal:8083   # notification-service
