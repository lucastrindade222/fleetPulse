spring.application.name=ingestion-service

# ---- SmartFleet ----
server.port=8081
spring.threads.virtual.enabled=true

# Observabilidade
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.metrics.tags.application=ingestion-service
spring.datasource.url=jdbc:postgresql://localhost:5432/telemetry
spring.datasource.username=smartfleet
spring.datasource.password=smartfleet
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
app.kafka.topic=telemetry-events
